name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.4.2
        required: true
        type: string
      target_ref:
        description: Source commit or branch (manual releases only)
        default: master
        type: string
      approved_draft:
        description: Verify and publish registered historical draft assets
        default: false
        type: boolean
      make_latest:
        description: Mark this version as Latest
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  APPROVED_DRAFT: ${{ inputs.approved_draft || false }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the release tooling from this workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Check out the requested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
          path: source
          persist-credentials: false
      - name: Validate tag and source version
        run: python3 release-tools/scripts/releases/release.py check-source --source source --tag "$RELEASE_TAG"
      - name: Validate release tooling
        run: python3 -m unittest discover -s release-tools/scripts/releases -p 'test_*.py'
      - uses: gradle/actions/wrapper-validation@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.5+8'
          cache: gradle
      - name: Build and check the selected version
        working-directory: source
        run: ./gradlew --no-daemon build :fabric:compileClientGameTestJava :fabric:compileServerSmokeJava
      - name: Prepare verified release assets and notes
        shell: bash
        run: |
          args=(prepare --source source --tag "$RELEASE_TAG" --output dist --notes-dir release-tools/docs/releases)
          if [[ "$APPROVED_DRAFT" == true ]]; then
            args+=(--historical)
          fi
          python3 release-tools/scripts/releases/release.py "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist
      - name: Publish without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_LATEST: ${{ github.event_name == 'push' || inputs.make_latest }}
        run: python3 release-tools/scripts/releases/release.py publish --output dist --repository "$GITHUB_REPOSITORY"
