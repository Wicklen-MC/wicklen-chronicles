plugins {
    id 'java-library'
}

// The game adapter chooses its own Minecraft-required JDK. The domain only
// needs Java 17 and deliberately has no Minecraft, Fabric or JSON dependency.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

sourceSets {
    regression {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('regressionTest', JavaExec) {
    group = 'verification'
    description = 'Checks quest transitions without Minecraft or external services.'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.core.quest.QuestRegressionChecks'
}

tasks.named('check') {
    dependsOn tasks.named('regressionTest')
}

tasks.register('firstLightTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.core.field.FirstLightChecks'
}
tasks.named('check') { dependsOn tasks.named('firstLightTest') }

tasks.register('mapRegressionTest', JavaExec) {
    group = 'verification'
    description = 'Checks immutable personal terrain, strict fog and map projection without Minecraft.'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.core.map.MapRegressionChecks'
}
tasks.named('check') { dependsOn tasks.named('mapRegressionTest') }


tasks.register('guidanceRegressionTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.core.guidance.GuidanceRegressionChecks'
}
tasks.named('check') { dependsOn tasks.named('guidanceRegressionTest') }
