plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

def verifyStationsSmoke = providers.gradleProperty('verifyStationsSmokes').map { it.toBoolean() }.getOrElse(false)
def verifyCombatSmoke = providers.gradleProperty('verifyCombatSmokes').map { it.toBoolean() }.getOrElse(false)
def smokeFolder = verifyCombatSmoke ? 'combat-smoke' : (verifyStationsSmoke ? 'station-smoke' : 'server-smoke')
def smokeRunPath = 'build/' + smokeFolder
def verifyCombatClient = providers.gradleProperty('verifyCombatClient').map { it.toBoolean() }.getOrElse(false)
def clientRunPath = verifyCombatClient ? 'build/client-combat-gametest' : 'build/client-gametest'

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"wicklen_chronicles" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	implementation project(':core')
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
	main {
		java.srcDirs = [rootProject.file('src/main/java')]
		resources.srcDirs = [rootProject.file('src/main/resources')]
	}
	client {
		java.srcDirs = [rootProject.file('src/client/java')]
		resources.srcDirs = [rootProject.file('src/client/resources')]
	}
	regression {
		java.srcDirs = [rootProject.file('src/regression/java')]
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
	clientGameTest {
		java.srcDirs = [rootProject.file('src/clientGameTest/java'), rootProject.file('src/nativeTestFixtures/java')]
		resources.srcDirs = [rootProject.file('src/clientGameTest/resources')]
		compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.client.runtimeClasspath
	}
	serverSmoke {
		java.srcDirs = [rootProject.file('src/serverSmoke/java'), rootProject.file('src/nativeTestFixtures/java')]
		resources.srcDirs = [rootProject.file('src/serverSmoke/resources')]
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.runtimeClasspath
	}
}

tasks.register('regressionTest', JavaExec) {
	group = 'verification'
	description = 'Checks request limits, persistence, config validation and both LLM protocols without external services.'
	classpath = sourceSets.regression.runtimeClasspath
	mainClass = 'dev.wicklen.chronicles.ai.RegressionChecks'
}
tasks.named('check') { dependsOn tasks.named('regressionTest') }

tasks.register('explorationTest', JavaExec) {
	group = 'verification'
	description = 'Checks focus continuity, discovery persistence and optional Field Guide compatibility.'
	classpath = sourceSets.regression.runtimeClasspath
	mainClass = 'dev.wicklen.chronicles.exploration.ExplorationChecks'
}
tasks.named('check') { dependsOn tasks.named('explorationTest') }

tasks.register('storyPlansTest', JavaExec) {
	group = 'verification'
	description = 'Checks the structured model output boundary against server-authored goals.'
	classpath = sourceSets.regression.runtimeClasspath
	mainClass = 'dev.wicklen.chronicles.story.StoryPlansChecks'
}
tasks.named('check') { dependsOn tasks.named('storyPlansTest') }

tasks.register('encounterPlanningTest', JavaExec) {
	group = 'verification'
	description = 'Checks the gentle combat director model boundary without external services.'
	classpath = sourceSets.regression.runtimeClasspath
	mainClass = 'dev.wicklen.chronicles.encounter.EncounterPlanningChecks'
}
tasks.named('check') { dependsOn tasks.named('encounterPlanningTest') }

tasks.register('firstLightNarrationTest', JavaExec) {
	group = 'verification'
	classpath = sourceSets.regression.runtimeClasspath
	mainClass = 'dev.wicklen.chronicles.firstlight.FirstLightNarrationChecks'
}
tasks.named('check') { dependsOn tasks.named('firstLightNarrationTest') }

tasks.register('liveFirstLightNarrationTest', JavaExec) {
	group = 'verification'
	description = 'Opt-in external first-light narration check; explicit private config required.'
	classpath = sourceSets.regression.runtimeClasspath
	mainClass = 'dev.wicklen.chronicles.firstlight.FirstLightNarrationChecks'
	def configPath = providers.gradleProperty('liveSpiritConfig')
	doFirst { if (!configPath.isPresent()) throw new GradleException('Supply -PliveSpiritConfig with an explicitly approved private config') }
	if (configPath.isPresent()) args configPath.get()
}

tasks.register('stationTest', JavaExec) {
	group = 'verification'
	description = 'Checks station variants, rotations, stable manifests and attachment codec.'
	classpath = sourceSets.regression.runtimeClasspath
	mainClass = 'dev.wicklen.chronicles.station.StationChecks'
}
tasks.named('check') { dependsOn tasks.named('stationTest') }

tasks.register('liveStoryProviderTest', JavaExec) {
	group = 'verification'
	description = 'Opt-in external story check using an explicitly supplied private config (never part of check).'
	classpath = sourceSets.regression.runtimeClasspath
	mainClass = 'dev.wicklen.chronicles.story.LiveStoryProviderCheck'
	def configPath = providers.gradleProperty('liveSpiritConfig')
	if (configPath.isPresent()) args configPath.get()
	def directory = project.layout.buildDirectory.dir('verification/liveStoryProviderTest')
	workingDir directory
	doFirst { directory.get().asFile.mkdirs() }
}

tasks.register('liveEncounterProviderTest', JavaExec) {
	group = 'verification'
	description = 'Opt-in external combat planner check with an explicitly supplied private config.'
	classpath = sourceSets.regression.runtimeClasspath
	mainClass = 'dev.wicklen.chronicles.encounter.LiveEncounterProviderCheck'
	def configPath = providers.gradleProperty('liveSpiritConfig')
	if (configPath.isPresent()) args configPath.get()
}

loom {
	mods {
		'wicklen_chronicles-test' { sourceSet sourceSets.clientGameTest }
		'wicklen_chronicles-server-smoke' { sourceSet sourceSets.serverSmoke }
	}
	runs {
		configureEach { runDir rootProject.file('run').absolutePath }
		clientGameTest {
			client()
			source sourceSets.clientGameTest
			if (System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('mac')) vmArg '-XstartOnFirstThread'
			runDir rootProject.file(clientRunPath).absolutePath
			if (verifyCombatClient) vmArg '-Dwicklen.chronicles.client.verifyCombat=true'
			vmArg '-Dfabric.client.gametest'
			vmArg '-Dfabric.client.gametest.testModResourcesPath=' + rootProject.file('src/clientGameTest/resources').absolutePath
		}
		serverSmoke {
			server()
			source sourceSets.serverSmoke
			runDir rootProject.file(smokeRunPath).absolutePath
			vmArg '-Dwicklen_chronicles.serverSmoke=true'
			vmArg '-Dwicklen_chronicles.serverSmoke.directory=' + rootProject.file(smokeRunPath).absolutePath
			if (providers.gradleProperty('verifyBalanceSmokes').map { it.toBoolean() }.getOrElse(false)) {
				vmArg '-Dwicklen.chronicles.smoke.verifyBalance=true'
			}
			if (verifyStationsSmoke) vmArg '-Dwicklen.chronicles.smoke.verifyStations=true'
			if (verifyCombatSmoke) vmArg '-Dwicklen.chronicles.smoke.verifyCombat=true'
			if (providers.gradleProperty('verifyHostileMigrationSmokes').map { it.toBoolean() }.getOrElse(false)) {
				vmArg '-Dwicklen.chronicles.smoke.verifyHostileMigration=true'
			}
			programArg 'nogui'
		}
	}
}

def smokeDirectory = rootProject.layout.buildDirectory.dir(smokeFolder)
def acceptedEula = rootProject.layout.projectDirectory.file('run/eula.txt')
tasks.named('runServerSmoke') {
	group = 'verification'
	description = 'Boots and cleanly stops an isolated dedicated server; never uses run/world.'
	doFirst {
		def directory = smokeDirectory.get().asFile
		directory.mkdirs()
		def marker = new File(directory, 'smoke-result.txt')
		if (marker.exists() && !marker.delete()) throw new GradleException('Cannot clear old server smoke result')
		// Reuse the developer's existing Minecraft EULA acceptance; never accept a new agreement.
		def accepted = acceptedEula.asFile
		if (!accepted.exists() || !accepted.readLines().any { it.trim() == 'eula=true' }) {
			throw new GradleException('Server smoke requires existing EULA acceptance in run/eula.txt')
		}
		new File(directory, 'eula.txt').text = accepted.text
		new File(directory, 'server.properties').text = '''server-ip=127.0.0.1
server-port=0
online-mode=false
enable-rcon=false
enable-query=false
view-distance=2
simulation-distance=2
level-name=smoke-world
max-tick-time=60000
'''
		if (verifyStationsSmoke) {
			def properties = new File(directory, 'server.properties')
			properties.text = properties.text.replace('level-name=smoke-world', 'level-name=station-smoke-world') + '''level-type=minecraft:flat
level-seed=732719
generator-settings={"biome":"minecraft:plains","features":true,"lakes":false,"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}
'''
			def fixture = new File(directory, 'station-smoke-world/datapacks/station-fixture')
			fixture.mkdirs()
			new File(fixture, 'pack.mcmeta').text = '''{"pack":{"description":"Isolated station generation fixture","min_format":[101,1],"max_format":999}}'''
			def feature = new File(fixture, 'data/wicklen_chronicles/worldgen/placed_feature/waystation.json')
			feature.parentFile.mkdirs()
			feature.text = '''{"feature":"wicklen_chronicles:waystation","placement":[{"type":"minecraft:rarity_filter","chance":1},{"type":"minecraft:biome"}]}'''
		}

	}
	doLast {
		def marker = new File(smokeDirectory.get().asFile, 'smoke-result.txt')
		if (!marker.exists() || marker.text.trim() != 'PASS') {
			throw new GradleException('Dedicated server smoke did not pass; inspect build/server-smoke/logs/latest.log')
		}
	}
}

// Public artifact name can change without renaming the saved-data/mod namespace.
base { archivesName = 'wicklen-chronicles' }

jar {
	dependsOn ':core:classes'
	from project(':core').sourceSets.main.output
	destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
	def projectName = project.name
	inputs.property "projectName", projectName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = 'wicklen-chronicles'
			// The core is already bundled into this single installable mod JAR.
			// Publish archives, not the Java component's dependency variants: those
			// would require a separately published core artifact. Runtime Fabric
			// dependencies are declared by the mod's fabric.mod.json instead.
			artifact tasks.named('jar')
			artifact tasks.named('sourcesJar')
			pom {
				name = 'Wicklen: Chronicles'
				description = 'Spirit companion, quests and chronicles for the world of Wicklen.'
			}
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// The pure Java core is bundled into the same mod, including in source artifacts.
tasks.named('sourcesJar') {
	from project(':core').sourceSets.main.allSource
	from rootProject.file('LICENSE')
	destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
}

['worldStorageTest': 'dev.wicklen.chronicles.ai.WorldStorageChecks',
 'questAdapterTest': 'dev.wicklen.chronicles.ai.QuestAdapterChecks'].each { taskName, entryPoint ->
	tasks.register(taskName, JavaExec) {
		group = 'verification'
		classpath = sourceSets.regression.runtimeClasspath
		mainClass = entryPoint
	}
	tasks.named('check') { dependsOn tasks.named(taskName) }
}

// Concurrent verification JVMs must not rotate the same Minecraft Log4j file.
tasks.withType(JavaExec).configureEach {
	if (name in ['regressionTest', 'worldStorageTest', 'questAdapterTest']) {
		def directory = project.layout.buildDirectory.dir("verification/${name}")
		workingDir directory
		doFirst { directory.get().asFile.mkdirs() }
	}
}

tasks.register('terrainMapTest', JavaExec) {
    group = 'verification'
    description = 'Checks bounded regional terrain persistence and private map projection offline.'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.terrain.TerrainMapChecks'
}
tasks.named('check') { dependsOn tasks.named('terrainMapTest') }


tasks.register('guidanceTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.guidance.GuidanceChecks'
}
tasks.register('journeyMemoryTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.ai.SpiritJourneyContextChecks'
}
tasks.named('check') { dependsOn tasks.named('guidanceTest'), tasks.named('journeyMemoryTest') }


// Hidden macOS test windows may block in SDL_GL_SwapWindow with display-synchronised presentation.
// This is only the generated test profile, never a launcher instance or player preference.
def nativeClientOptionsFile = rootProject.file(clientRunPath + '/options.txt')
tasks.named('runClientGameTest', JavaExec) {
    doFirst {
        def options = nativeClientOptionsFile
        def lines = options.exists() ? options.readLines('UTF-8') : []
        lines.removeAll { it.startsWith('enableVsync:') }
        lines.add('enableVsync:false')
        options.parentFile.mkdirs()
        options.setText(lines.join('\n') + '\n', 'UTF-8')
    }
}


tasks.register('liveJourneyMemoryTest', JavaExec) {
    group = 'verification'
    description = 'Opt-in single provider check with fictional personal journey facts.'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.ai.LiveJourneyMemoryChecks'
    def configPath = providers.gradleProperty('liveSpiritConfig')
    doFirst { if (!configPath.isPresent()) throw new GradleException('Supply -PliveSpiritConfig with an explicitly approved private config') }
    if (configPath.isPresent()) args configPath.get()
}


tasks.register('mapCameraTest', JavaExec) {
    group = 'verification'
    description = 'Checks fractional map movement, cursor-anchored zoom and bounded camera geometry.'
    classpath = sourceSets.clientGameTest.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.client.TerrainMapCameraChecks'
}
tasks.named('check') { dependsOn tasks.named('mapCameraTest') }


tasks.register('automaticSpeechTest', JavaExec) {
    group = 'verification'
    description = 'Checks personal automatic-speech cadence, fresh causes and manual/automatic separation.'
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'dev.wicklen.chronicles.ai.SpiritAutomaticSpeechChecks'
}
tasks.named('check') { dependsOn tasks.named('automaticSpeechTest') }
