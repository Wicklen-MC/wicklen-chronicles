plugins {
    id 'base'
}

allprojects {
    group = rootProject.group
    version = rootProject.version
}

tasks.named('build') { dependsOn ':core:build', ':fabric:build' }
tasks.named('check') { dependsOn ':core:check', ':fabric:check' }
tasks.named('clean') { dependsOn ':core:clean', ':fabric:clean' }

// Keep the existing developer entry points while the mod becomes a subproject.
['runClient', 'runServer', 'runClientGameTest', 'runServerSmoke', 'regressionTest',
 'worldStorageTest', 'questAdapterTest'].each { entryPoint ->
    tasks.register(entryPoint) { dependsOn ":fabric:${entryPoint}" }
}
